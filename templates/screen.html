<body class="screen-body">
    <!-- Top Header Bar for Projector -->
    <header class="screen-header">
        <div class="screen-title-box">
            <span class="ceremony-hat">🧙‍♂️</span>
            <h1 class="gold-title main-screen-title" data-i18n="screen_title">Hogwarts Sorting Ceremony</h1>
        </div>
        <div class="header-right">
            <div id="connection-status" class="status-indicator">
                <span class="status-dot"></span>
                <span id="status-text" data-i18n="connected">Live</span>
            </div>
            <div class="lang-switch">
                <button type="button" class="lang-btn active" data-lang="en">EN</button>
                <button type="button" class="lang-btn" data-lang="de">DE</button>
            </div>
        </div>
    </header>

    <!-- Center Stage for Sorting Animation -->
    <div id="center-stage" class="center-stage hidden" style="display: none;" title="Click anywhere to dismiss">
        <div class="center-stage-backdrop"></div>
        <button type="button" id="btn-close-center-stage" class="center-stage-close" aria-label="Close">✕</button>
        <div class="center-content">
            <div id="center-hat-anim" class="center-hat">🎩</div>
            <p id="hesitant-banner" class="hesitant-banner hidden" data-i18n="hesitant_text">
                "Hmm... a difficult choice between two great houses..."
            </p>
            <div id="flying-name" class="flying-name"></div>
            <div id="flying-destination" class="flying-destination"></div>
        </div>
    </div>

    <!-- House Points Award Center Modal / Announcement -->
    <div id="points-modal-stage" class="points-modal-stage hidden" style="position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 2500; display: none; align-items: center; justify-content: center;" title="Click anywhere to dismiss">
        <div class="points-modal-backdrop"></div>
        <div class="points-modal-card" id="points-modal-card">
            <div id="points-modal-crest" class="points-modal-crest">🦁</div>
            <div id="points-modal-amount" class="points-modal-amount">+2 PTS</div>
            <h2 id="points-modal-title" class="points-modal-title">Gryffindor Wins House Cup Points!</h2>
            <p id="points-modal-wizard" class="points-modal-wizard">Cast by Harry Potter ✨</p>
            <div class="points-modal-sparkles">🏆 ✨ 🏆</div>
        </div>
    </div>

    <!-- 4 House Zones Grid -->
    <main class="houses-grid">
        <!-- Gryffindor Zone -->
        <section id="house-zone-GRY" class="house-zone zone-gry">
            <div class="house-zone-header">
                <div class="crest-circle">🦁</div>
                <div class="house-zone-meta">
                    <h2 class="house-name" data-house="GRY">Gryffindor</h2>
                    <div class="house-counters-row">
                        <span id="counter-GRY" class="house-counter" title="Enrolled Students">0 👥</span>
                        <span id="game-points-GRY" class="house-cup-badge gry" title="House Cup Points">0 🏆</span>
                    </div>
                </div>
            </div>
            <div class="house-students-container">
                <ul id="list-GRY" class="students-list">
                    <!-- Populated by JS -->
                </ul>
            </div>
        </section>

        <!-- Ravenclaw Zone -->
        <section id="house-zone-RAV" class="house-zone zone-rav">
            <div class="house-zone-header">
                <div class="crest-circle">🦅</div>
                <div class="house-zone-meta">
                    <h2 class="house-name" data-house="RAV">Ravenclaw</h2>
                    <div class="house-counters-row">
                        <span id="counter-RAV" class="house-counter" title="Enrolled Students">0 👥</span>
                        <span id="game-points-RAV" class="house-cup-badge rav" title="House Cup Points">0 🏆</span>
                    </div>
                </div>
            </div>
            <div class="house-students-container">
                <ul id="list-RAV" class="students-list">
                    <!-- Populated by JS -->
                </ul>
            </div>
        </section>

        <!-- Hufflepuff Zone -->
        <section id="house-zone-HUF" class="house-zone zone-huf">
            <div class="house-zone-header">
                <div class="crest-circle">🦡</div>
                <div class="house-zone-meta">
                    <h2 class="house-name" data-house="HUF">Hufflepuff</h2>
                    <div class="house-counters-row">
                        <span id="counter-HUF" class="house-counter" title="Enrolled Students">0 👥</span>
                        <span id="game-points-HUF" class="house-cup-badge huf" title="House Cup Points">0 🏆</span>
                    </div>
                </div>
            </div>
            <div class="house-students-container">
                <ul id="list-HUF" class="students-list">
                    <!-- Populated by JS -->
                </ul>
            </div>
        </section>

        <!-- Slytherin Zone -->
        <section id="house-zone-SLY" class="house-zone zone-sly">
            <div class="house-zone-header">
                <div class="crest-circle">🐍</div>
                <div class="house-zone-meta">
                    <h2 class="house-name" data-house="SLY">Slytherin</h2>
                    <div class="house-counters-row">
                        <span id="counter-SLY" class="house-counter" title="Enrolled Students">0 👥</span>
                        <span id="game-points-SLY" class="house-cup-badge sly" title="House Cup Points">0 🏆</span>
                    </div>
                </div>
            </div>
            <div class="house-students-container">
                <ul id="list-SLY" class="students-list">
                    <!-- Populated by JS -->
                </ul>
            </div>
        </section>
    </main>

    <!-- Floating Live Points Toast Container (Fallback) -->
    <div id="screen-toast-container" class="screen-toast-container"></div>

    <script src="/static/js/i18n.js?v=20260828_06"></script>
    <script src="/static/js/screen.js?v=20260828_06"></script>
</body>
</html>
