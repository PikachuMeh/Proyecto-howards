services:
  sorting-hat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hogwarts-sorting-hat
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - ADMIN_PASSWORD=alohomora
      - SECRET_KEY=gryffindor-ravenclaw-hufflepuff-slytherin-magic-key-2026
      - RELOAD=false
    volumes:
      - sorting_hat_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  sorting_hat_data:
    name: sorting_hat_data
