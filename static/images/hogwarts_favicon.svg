<svg xmlns=http://www.w3.org/2000/svg viewBox=0 0 64 64 width=64 height=64>
  <defs>
    <radialGradient id=skyGrad cx=50% cy=50% r=50%>
      <stop offset=0% stop-color=#1e293b/>
      <stop offset=100% stop-color=#090d16/>
    </radialGradient>
    <linearGradient id=goldGrad x1=0% y1=0% x2=100% y2=100%>
      <stop offset=0% stop-color=#fef08a/>
      <stop offset=50% stop-color=#eab308/>
      <stop offset=100% stop-color=#ca8a04/>
    </linearGradient>
    <filter id=glow x=-20% y=-20% width=140% height=140%>
      <feGaussianBlur stdDeviation=1.5 result=blur />
      <feComposite in=SourceGraphic in2=blur operator=over />
    </filter>
  </defs>

  <!-- Background Circle Badge with Golden Border -->
  <circle cx=32 cy=32 r=30 fill=url(#skyGrad) stroke=url(#goldGrad) stroke-width=2.5/>
  <circle cx=32 cy=32 r=28 fill=none stroke=rgba(234, 179, 8, 0.3) stroke-width=0.8/>

  <!-- Magic Sparkles / Stars -->
  <circle cx=16 cy=14 r=1 fill=#fef08a opacity=0.8/>
  <circle cx=48 cy=16 r=1.2 fill=#fef08a opacity=0.9/>
  <circle cx=24 cy=10 r=0.8 fill=#fef08a opacity=0.7/>
  <circle cx=38 cy=8 r=1.5 fill=#fde047 opacity=0.8 filter=url(#glow)/>

  <!-- Hogwarts Castle Silhouette with Golden Accents -->
  <path d=M8 52 C14 46, 20 48, 28 50 C36 52, 44 47, 56 52 L56 56 C44 58, 20 58, 8 56 Z fill=#0f172a stroke=url(#goldGrad) stroke-width=0.8/>

  <!-- Great Hall & Central Spires -->
  <path d=M22 50 L22 34 L27 34 L27 50 Z fill=#1e293b stroke=url(#goldGrad) stroke-width=0.8/>
  <rect x=23.5 y=38 width=2 height=3 rx=1 fill=#fef08a opacity=0.9/>
  <rect x=23.5 y=44 width=2 height=3 rx=1 fill=#fef08a opacity=0.9/>

  <!-- Main Tower (Astronomy Tower) -->
  <path d=M28 50 L28 26 L36 26 L36 50 Z fill=#1e293b stroke=url(#goldGrad) stroke-width=0.8/>
  <polygon points=27,26 32,14 37,26 fill=url(#goldGrad)/>
  <circle cx=32 cy=14 r=1 fill=#fff filter=url(#glow)/>
  <rect x=30.5 y=30 width=3 height=5 rx=1.5 fill=#fef08a/>
  <rect x=30.5 y=40 width=3 height=5 rx=1.5 fill=#fef08a/>

  <!-- Right Tower -->
  <path d=M38 50 L38 32 L44 32 L44 50 Z fill=#1e293b stroke=url(#goldGrad) stroke-width=0.8/>
  <polygon points=37,32 41,20 45,32 fill=url(#goldGrad)/>
  <rect x=39.5 y=36 width=2.5 height=4 rx=1 fill=#fef08a opacity=0.9/>

  <!-- Far Left Turret -->
  <path d=M14 50 L14 38 L18 38 L18 50 Z fill=#1e293b stroke=url(#goldGrad) stroke-width=0.8/>
  <polygon points=13,38 16,28 19,38 fill=url(#goldGrad)/>

  <!-- Far Right Turret -->
  <path d=M46 50 L46 40 L50 40 L50 50 Z fill=#1e293b stroke=url(#goldGrad) stroke-width=0.8/>
  <polygon points=45,40 48,30 51,40 fill=url(#goldGrad)/>

  <path d=M10 24 Q18 20 22 28 fill=none stroke=#fef08a stroke-width=0.8 stroke-dasharray=1 2 opacity=0.6/>
</svg>
